<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<img src="logo.png.JPG" alt="ورقتي" style="width:90px;border-radius:16px;display:block;margin:12px auto;">
<meta name="theme-color" content="#1f46c4">
<link rel="apple-touch-icon" href="logo.png.JPG">
  <title>ورقتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* التصميم: واجهة هادئة بلون أزرق حبري، والورقة نفسها بيضاء بخط عربي مختار */
:root{
  --bg:#f3f5f9; --sf:#ffffff; --ink:#141b2d; --mut:#5b6478; --ln:#dde2ec;
  --ac:#1f46c4; --ac-ink:#ffffff; --ac-soft:#e8edfc; --dg:#c0352b; --pv:#6b7385;
  --sh:0 1px 2px rgba(20,27,45,.06),0 6px 20px rgba(20,27,45,.07);
  --page-h:297mm; --pt:14mm; --pb:19mm;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f121a; --sf:#171b26; --ink:#e9ecf4; --mut:#98a1b6; --ln:#272d3c;
    --ac:#8aa4ff; --ac-ink:#0d1330; --ac-soft:#1f2745; --dg:#ff8a80; --pv:#2a2f3d;
    --sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Tajawal','Amiri',system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(24px + env(safe-area-inset-bottom,0px))}
body.fmt-on{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body.fmt-on .dock{display:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--ln)}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.top small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.brand{font-family:'Amiri',serif;font-size:30px;font-weight:700;line-height:1;color:var(--ac)}

.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--ac);color:var(--ac-ink);border-color:var(--ac);font-weight:700}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.armed,.ico.armed{background:var(--dg);border-color:var(--dg);color:#fff}
.ico{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);display:inline-grid;place-items:center;font-size:15px;padding:0;flex:none}
.ico[disabled]{opacity:.35;cursor:default}
.ico.armed{width:auto;padding:0 8px;font-size:13px}
.ico svg{width:18px;height:18px}
.ico.off{color:var(--mut)}

.hero{padding:22px 0 6px}
.hero p{margin:4px 0 0;color:var(--mut)}
.new-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 10px}
.tile{border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:16px;text-align:right;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.tile b{font-size:17px}
.tile span{color:var(--mut);font-size:14px;line-height:1.5}
.tile svg{width:44px;height:56px}
.tile-wide{width:100%;margin-bottom:22px;flex-direction:row;align-items:center;gap:12px}
.tile-wide div{flex:1}
h2.sec{font-size:15px;color:var(--mut);font-weight:500;margin:6px 0 10px}
.list{display:flex;flex-direction:column;gap:10px}
.doc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.doc .open{flex:1;min-width:0;text-align:right;background:none;border:0;padding:0;display:block}
.doc .t{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .s{font-size:13px;color:var(--mut)}
.badge{font-size:12px;border-radius:6px;padding:1px 8px;margin-inline-end:6px;font-weight:700;background:var(--ac-soft);color:var(--ac)}
.badge.ex{background:#eceef3;color:#333}
@media (prefers-color-scheme:dark){.badge.ex{background:#2a2f3d;color:#d7dbe6}}
.foot-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--ln);border-radius:14px}

.tabs{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:3px;margin:12px 0;gap:3px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:500;color:var(--mut)}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--ac-ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:15px}
.card-top{display:flex;align-items:center;gap:8px}
.tools{margin-inline-start:auto;display:flex;gap:6px}
.tag{font-family:'Amiri',serif;font-weight:700;font-size:20px;background:var(--ac);color:var(--ac-ink);border-radius:8px;padding:0 12px;line-height:1.5}
.tag-h{font-family:'Tajawal',sans-serif;font-size:13px;background:var(--ac-soft);color:var(--ac)}
.in{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
.in:focus{outline:2px solid var(--ac);outline-offset:0;border-color:var(--ac)}
textarea.in{resize:none;min-height:44px;line-height:1.7;font-family:'Amiri','Tajawal',serif;font-size:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:13px;color:var(--mut)}
.mk{width:76px;flex:none;text-align:center}
.grow{flex:1}
.branch{border-inline-start:3px solid var(--ac-soft);padding-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.br-head{display:flex;gap:6px;align-items:center}
.br-tag{font-family:'Amiri',serif;font-weight:700;font-size:18px;color:var(--ac);min-width:22px;text-align:center}
details.ans summary{cursor:pointer;color:var(--ac);font-size:14px;font-weight:500;padding:2px 0;list-style-position:inside}
details.ans textarea{margin-top:6px}
.addrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--ac-soft);color:var(--ac);border-radius:12px;padding:8px 14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.lbl{font-size:13px;color:var(--mut)}
.inw{display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.opt small{display:block;color:var(--mut);font-size:12px;line-height:1.5}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.opt input[type=range]{flex:1;max-width:220px;accent-color:var(--ac)}
.seg{display:flex;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:0;background:none;border-radius:9px;padding:7px 6px;color:var(--mut);font-weight:500;font-size:14px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ac);font-weight:700;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--bg);border-radius:99px;padding:5px 14px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ac);color:var(--ac-ink);border-color:var(--ac);font-weight:700}
.step{display:inline-flex;align-items:center;background:var(--ac-soft);border-radius:99px;padding:2px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:none;font-size:20px;color:var(--ac);font-weight:700}
.step b{min-width:30px;text-align:center;color:var(--ac)}
.pals{display:flex;flex-wrap:wrap;gap:8px}
.pal{border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:14px}
.pal[aria-pressed=true]{border-color:var(--ac)}
.pal i{width:16px;height:16px;border-radius:50%;display:inline-block}
.pal i+i{margin-inline-start:-10px}
.colors{display:flex;gap:16px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:8px;font-size:14px}
.colors input{width:42px;height:34px;border:1px solid var(--ln);border-radius:8px;padding:2px;background:var(--sf)}
.dock{position:sticky;bottom:0;margin-top:16px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);margin-inline:-16px;padding-inline:16px}
.dock .btn{width:100%;padding:13px;font-size:17px}
.hint{font-size:13px;color:var(--mut);margin:10px 2px 0;line-height:1.7}
.part{border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.part-h{display:flex;align-items:center;gap:6px}
.part-h b{font-size:14px;color:var(--ac);flex:1}
.part .ico{width:30px;height:30px;background:var(--sf)}
.tbed{overflow-x:auto}
.tbed table{border-collapse:separate;border-spacing:4px}
.tbed input{min-width:92px}

/* شريط التنسيق */
.fmt{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sf);border-top:1px solid var(--ln);padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
.fmt.inl .fmt-bar{flex-wrap:wrap;overflow:visible}
.fmt.inl{position:relative;left:auto;right:auto;bottom:auto;top:auto;margin:6px 0;border:1px solid var(--ln);border-radius:12px;padding:6px;box-shadow:none;z-index:5}
.fmt.ontop>*{min-width:0}
.fmt.ontop{border-top:0;border-bottom:1px solid var(--ln);display:flex;flex-direction:column-reverse;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.fmt-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.fmt-bar::-webkit-scrollbar{display:none}
.fmt-bar button,.fmt-pal button{flex:none;border:1px solid var(--ln);background:var(--ac-soft);color:var(--ac);border-radius:10px;padding:7px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.fmt-pal{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px;max-height:112px;overflow-y:auto}
.fmt-pal button{font-family:'Amiri',serif;font-size:22px;padding:2px 12px;min-width:44px;line-height:1.6}

/* قائمة الإضافة */
.msheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.mpanel{position:relative;width:100%;max-width:720px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85dvh;overflow-y:auto}
.mpanel h3{margin:0 0 12px;font-size:17px}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.mgrid button{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;min-height:84px;justify-content:center}
.mgrid b{font-size:15px}
.mgrid span{font-size:11.5px;color:var(--mut);line-height:1.4}
@media (max-width:380px){.mgrid{grid-template-columns:1fr 1fr}}

/* المعاينة */
.viewer{overflow:auto;background:var(--pv);border-radius:12px;padding:12px;margin-top:10px;max-height:calc(100dvh - 210px);min-height:360px}
.stage{position:relative;margin:0 auto}
.stage .sheet{position:absolute;top:0;right:0;transform-origin:top right;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.pager{display:flex;align-items:center;gap:8px;margin-top:10px}
.thumbs{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px}
.thumbs button{min-width:38px;height:38px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);font-weight:700}
.thumbs button[aria-current=true]{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw}

/* ===== الورقة (A4) ===== */
.sheet{--ff:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;width:210mm;height:297mm;background:#fff;color:#000;padding:var(--pt) 15mm 0;position:relative;overflow:hidden;direction:rtl;
  font-family:var(--ff);font-size:var(--fs,14pt);line-height:1.7;text-align:right}
.sheet .body{height:calc(var(--page-h) - var(--pt) - var(--pb));overflow:hidden}
.sheet.bd::before{content:"";position:absolute;inset:6mm;border:.5mm solid var(--bdc,#000);pointer-events:none}
.sheet .foot{position:absolute;left:15mm;right:15mm;bottom:8.5mm;display:flex;justify-content:space-between;gap:6mm;font-size:10.5pt;color:#444;border-top:.25mm solid #999;padding-top:1.6mm}
.sheet .foot span{flex:1}
.sheet .foot span:nth-child(2){text-align:center}
.sheet .foot span:nth-child(3){text-align:left}
#measure{position:fixed;left:-12000px;top:0;visibility:hidden;pointer-events:none}
#measure.sheet{height:auto;overflow:visible}
#measure .body{height:auto;overflow:visible}
#probe{position:fixed;left:-100px;top:0;width:1px;visibility:hidden;height:calc(var(--page-h) - var(--pt) - var(--pb))}
.unit{padding-bottom:3.4mm;display:flow-root}
.unit.sep{border-top:.25mm solid #999;padding-top:2.6mm}
.q-row{display:flex;gap:2.2mm;align-items:baseline}
.q-no{font-weight:700;white-space:nowrap}
.q-text{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.q-marks{white-space:nowrap;font-size:.8em}
.br-wrap{margin-inline-start:8mm;margin-top:1mm}
.br-no{font-weight:700;min-width:6mm;white-space:nowrap}
.a-row{display:flex;gap:2.2mm;align-items:baseline;margin-top:1.2mm}
.a-no{font-weight:700;white-space:nowrap}
.a-text{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.space{display:block}
.space.lines{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 7.3mm,#555 7.3mm,#555 7.55mm)}
.bism{text-align:center;font-weight:700;font-size:1.15em;margin-bottom:1.6mm}
.note{border:.3mm solid #000;padding:.8mm 3mm;margin:1.6mm 0 2mm;font-size:.95em}

/* أجزاء السؤال */
.psg{border:.3mm solid #000;border-radius:1.5mm;padding:2.2mm 3.4mm;margin:1.6mm 0;text-align:justify;white-space:pre-wrap;overflow-wrap:anywhere}
.poem{width:90%;margin:1.8mm auto;display:flex;flex-direction:column;gap:.8mm}
.vr{display:grid;grid-template-columns:1fr 1fr;column-gap:14mm}
.vr span:first-child{text-align:right}
.vr span:last-child{text-align:left}
.vr.one span{grid-column:1/-1;text-align:center}
.qt{text-align:center;font-weight:700;margin:1.8mm 0;font-size:1.08em;white-space:pre-wrap}
.qt small{display:block;font-weight:400;font-size:.8em}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(38mm,1fr));gap:.6mm 4mm;margin:1.2mm 8mm 0 0}
.chs b{margin-inline-end:1.2mm}
.mt-row{display:flex;gap:3mm;align-items:baseline;margin:.8mm 8mm .8mm 0}
.mt-a,.mt-b{flex:1;min-width:0;white-space:pre-wrap}
.mt-g{white-space:nowrap}
.tb{border-collapse:collapse;width:100%;margin:1.8mm 0}
.tb td,.tb th{border:.3mm solid #000;padding:1mm 2mm;text-align:center;vertical-align:top;white-space:pre-wrap}
.tb th{font-weight:700}
.pts{margin:1mm 8mm 0 0}
.pts .q-row{margin:.4mm 0}
.clo{text-align:center}
.clo-t{font-weight:700}
.clo-s{text-align:left;margin-top:2mm}

/* ورقة الامتحان: أبيض وأسود */
.exam .q-text{font-weight:700}
.exam .br-wrap .q-text,.exam .pts .q-text,.exam .mt-row,.exam .chs{font-weight:400}
.exam .q-marks{margin-inline-start:2mm}
.exam .a-text{font-weight:400}
.xh{margin-bottom:2mm}
.xh-cols{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:3mm;align-items:start;padding-bottom:2mm;border-bottom:.5mm solid #000;font-size:.95em;line-height:1.55}
.xh-cols>div{min-width:0}
.xh-mid{text-align:center;font-weight:700}
.xh-mid .t{font-size:1.15em;white-space:pre-wrap}
.xh-top{text-align:center;font-size:.95em;line-height:1.5}
.xh-school{text-align:center;font-weight:700;font-size:1.05em}
.xh-title{text-align:center;font-weight:700;font-size:1.4em;line-height:1.5;margin-bottom:1.4mm}
.xh-grid{display:flex;flex-wrap:wrap;border-top:.3mm solid #000}
.xc{flex:1 1 auto;padding:.8mm 2.4mm;border-inline-start:.3mm solid #000;white-space:nowrap}
.xc:first-child{border-inline-start:0;padding-inline-start:0}
.xh-stu{display:flex;justify-content:space-between;gap:4mm;border-top:.3mm solid #000;padding-top:1.4mm;margin-top:.4mm;white-space:nowrap}
.dots{display:inline-block;border-bottom:.3mm dotted #000;min-width:18mm;height:.9em;vertical-align:baseline}
.dots.wide{min-width:62mm}
.dots.sm{min-width:14mm}

/* الملزمة: ملونة */
.hand .hh{background:var(--qc);color:#fff;border-radius:3mm;padding:5mm 7mm;margin-bottom:1mm}
.hand .hh-title{font-weight:700;font-size:1.75em;line-height:1.4;white-space:pre-wrap}
.hand .hh-chips{display:flex;flex-wrap:wrap;gap:2.4mm;margin-top:2mm;font-size:.85em}
.hand .hh-chips span{border:.3mm solid rgba(255,255,255,.65);border-radius:99mm;padding:0 3.2mm;line-height:1.55}
.hand .bism{color:var(--qc)}
.h-sec{font-weight:700;text-decoration:underline;text-underline-offset:1.2mm;margin:2mm 0 1mm}
.cmp{line-height:1.55}
.cmp .xh-cols{grid-template-columns:1fr 1.7fr 1fr}
.cmp .xh-mid .t{font-size:1em}
.cmp .unit{padding-bottom:1mm}
.cmp .br-wrap{margin-inline-start:0;margin-top:0}
.cmp .q-row{gap:1mm}
.cmp.exam .q-text,.cmp.exam .br-wrap .q-text{font-weight:700}
.pts-in{display:flex;flex-wrap:wrap;gap:0 6mm;margin:.4mm 0 .2mm}
.pts-in.row{justify-content:space-between}
.pts-in.col{flex-direction:column;flex-wrap:nowrap;align-items:flex-start}
.pt-m{font-style:normal;font-size:.8em;margin-inline-start:1.2mm;white-space:nowrap}
.pts-in span{flex:0 1 auto;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:400}
.pts-in b{font-weight:400;margin-inline-end:.8mm}
.br-cols{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm}
.cmp .clo{text-align:left;font-size:.85em}
.cmp .clo-t{font-weight:400}
.h-heading{font-weight:700;font-size:1.2em;color:var(--qc);border-inline-start:2mm solid var(--qc);background:#f1f1f1;background:color-mix(in srgb,var(--qc) 9%,#fff);padding:.4mm 3mm;margin:2mm 0 3mm;line-height:1.6}
.hand .q-no{background:var(--qc);color:#fff;border-radius:1.3mm;padding:0 2.4mm;line-height:1.55;font-size:.95em}
.hand .q-text{color:var(--qc);font-weight:700}
.hand .br-no{color:var(--qc)}
.hand .br-wrap .q-text,.hand .pts .q-text{font-weight:400}
.hand .q-marks{color:var(--qc)}
.hand .a-no{color:var(--ac)}
.hand .a-text{color:var(--ac)}
.hand .foot{color:var(--ac);border-top-color:var(--ac)}
.hand .psg{border-color:var(--qc)}
.hand .tb td,.hand .tb th{border-color:var(--qc)}

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const AR='٠١٢٣٤٥٦٧٨٩';
const ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET=['أ','ب','ج','د','هـ','و','ز','ح','ط','ي','ك','ل','م','ن'];
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
const PALS=[['#b42318','#146c43','أحمر وأخضر'],['#1d4ed8','#c2410c','أزرق وبرتقالي'],['#6d28d9','#047857','بنفسجي وأخضر'],['#0f766e','#9a3412','تركوازي وبني'],['#be185d','#1e40af','وردي وأزرق']];
const FONTS={amiri:"'Amiri','Noto Naskh Arabic','Traditional Arabic',serif",naskh:"'Noto Naskh Arabic','Amiri','Traditional Arabic',serif",tajawal:"'Tajawal','Noto Naskh Arabic',sans-serif"};
const TASH=['َ','ُ','ِ','ْ','ّ','ً','ٌ','ٍ','ٰ','ٓ'];
const SYMS=['«','»','﴿','﴾','؟','،','؛','ﷺ','ﷻ','﷽','٪','…','(',')','[',']','↔','←','→','✓','✗','☐','◄','•','–','ـ','ء','أ','إ','آ','ؤ','ئ','ة','ى'];
const ZOOMS=[1,1.5,2,2.6];
const PW=793.7, PH=1122.5;
const KEY='wrqty.docs.v1';
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 4.1-5.1M9.9 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>';

let docs=[], cur=null, tab='items', view='home', pageIdx=0, zoom=0, sheetsArr=[];
let NUMM='ar', DIGM='as', EFFFS=14, lastField=null, sheetFor=-1;
let pendKind='exam', pendImgQ=-1, setupPrint=false, rec=null;
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>';

/* ---------- أدوات ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace('٫','.'));return isFinite(n)?n:0};
const pn=n=>NUMM==='en'?String(n).replace('.','.'):ar(n).replace('.','٫');
function dg(s){
  if(DIGM==='ar')return String(s).replace(/\d/g,d=>AR[d]);
  if(DIGM==='en')return String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d));
  return String(s);
}
function fmt(s){
  let t=esc(dg(s==null?'':s));
  return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<u>$1</u>');
}
function markLabel(n){
  if(n===1)return 'درجة واحدة'; if(n===2)return 'درجتان'; if(n===0.5)return 'نصف درجة';
  if(Number.isInteger(n)&&n>=3&&n<=10)return pn(n)+' درجات';
  return pn(n)+' درجة';
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function confirmTap(b){
  if(b.dataset.armed)return true;
  b.dataset.armed='1';const old=b.innerHTML;b.innerHTML='تأكيد؟';b.classList.add('armed');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.innerHTML=old;b.classList.remove('armed')}},2500);
  return false;
}
function getPath(o,path){return path.split('.').reduce((t,k)=>t==null?t:t[k],o)}
function setPath(o,path,v){const k=path.split('.');let t=o;for(let i=0;i<k.length-1;i++){if(t[k[i]]==null)t[k[i]]=/^\d+$/.test(k[i+1])?[]:{};t=t[k[i]]}t[k[k.length-1]]=v}

/* ---------- التخزين ---------- */
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(docs))}catch(e){}}

function defSettings(kind){
  const ex=kind==='exam';
  return{fs:14,space:ex?28:0,lines:false,answers:!ex,marks:ex,student:false,qc:ex?'#000000':PALS[0][0],ac:ex?'#000000':PALS[0][1],pal:0,
    font:'amiri',compact:ex,secTot:ex,compactV:1,fit1:ex,minFs:10,minSp:40,fitV:2,bw:true,color:false,frame:'single',orn:false,bism:ex,border:ex,sep:ex,cont:true,pageNo:true,
    qs:'slash',bs:'slash',ps:'dash',num:'ar',dig:'as',closing:ex?'مع تمنياتنا لكم بالنجاح والموفقية':'',cloLines:ex?3:0};
}
function defYear(){const t=new Date(),y=t.getFullYear(),a=t.getMonth()>=7?y:y-1;return ar(a)+'-'+ar(a+1)}
function defMeta(){return{ministry:'وزارة التربية',year:defYear(),directorate:'',school:'',subject:'',grade:'',teacher:'',tt:'مدرس المادة',date:'',time:'',total:'',optN:0,note:''}}
function norm(d){
  d.kind=d.kind==='exam'?'exam':'handout';
  d.meta=Object.assign(defMeta(),{ministry:''},d.meta||{});
  d.settings=Object.assign(defSettings(d.kind),{fit1:false,bism:false,border:false,sep:false,closing:'',cloLines:0},d.settings||{});
  d.hide=d.hide||{};d.logo=d.logo||'';
  if(d.settings.compactV!==1){d.settings.compactV=1;d.settings.compact=(d.kind==='exam');d.settings.secTot=(d.kind==='exam')}
  if(d.settings.minFs==null)d.settings.minFs=10;
  if(d.settings.minSp==null)d.settings.minSp=40;
  if(d.settings.fitV!==2){d.settings.fitV=2;d.settings.fit1=(d.kind==='exam')}
  d.items=(d.items||[]).map(it=>{
    if(it.type==='h')return it;
    it.parts=Array.isArray(it.parts)?it.parts:[];
    it.branches=Array.isArray(it.branches)?it.branches:[];
    return it;
  });
  return d;
}
function load(){
  try{docs=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){docs=null}
  if(!Array.isArray(docs)){docs=[sampleHandout(),sampleExam()];saveNow()}
  docs=docs.filter(d=>d&&d.items).map(norm);
}

/* ---------- النماذج ---------- */
function newDoc(kind){
  const ex=kind==='exam';
  const d={id:uid(),kind,title:ex?'امتحان جديد':'ملزمة جديدة',updated:Date.now(),meta:defMeta(),settings:defSettings(kind),hide:{},
    items:[{type:'q',text:'',marks:'',answer:'',space:'',branches:[],parts:[]}]};
  return d;
}
const Q=(text,o)=>Object.assign({type:'q',text,answer:'',marks:'',space:'',branches:[],parts:[]},o||{});
const B=(text,answer,marks,pts)=>({text,answer:answer||'',marks:marks||'',pts:pts||[]});
function sampleHandout(){
  const d=newDoc('handout');
  d.title='ملزمة النحو (مثال)';d.meta=Object.assign(defMeta(),{subject:'اللغة العربية',grade:'الخامس العلمي'});
  d.items=[
    {type:'h',text:'الفاعل ونائب الفاعل'},
    Q('عرّف الفاعل.',{answer:'اسم مرفوع يدل على من قام بالفعل أو اتصف به، ويأتي بعد فعل مبني للمعلوم.'}),
    Q('بيّن حكم الفاعل في الجملة الفعلية:',{branches:[B('ما حكمه من حيث الإعراب؟','الرفع دائماً.'),B('أين يقع الفاعل بالنسبة لفعله؟','يأتي بعد الفعل ولا يتقدم عليه.')]}),
    Q('أعرب ما تحته خط في قولنا: «كُتِبَ __الدرسُ__».',{answer:'كُتِبَ: فعل ماضٍ مبني للمجهول مبني على الفتح.\nالدرسُ: نائب فاعل مرفوع وعلامة رفعه الضمة الظاهرة.'}),
    Q('أكمل الفراغ بما يناسبه: الفاعل اسم …………… .',{answer:'مرفوع'}),
    Q('اقرأ البيت الآتي ثم أجب:',{parts:[{t:'poem',text:'لكلِّ داءٍ دواءٌ يُستطَبُّ بهِ / إلا الحماقةَ أعيتْ مَن يداويها'}],branches:[B('استخرج الفاعل من البيت.','الحماقةَ: مفعول به، ومن: اسم موصول في محل رفع فاعل أعيت.')]})
  ];
  return d;
}
function sampleExam(){
  const d=newDoc('exam');
  const G='  ';
  d.title='أسئلة امتحانات نهاية السنة الدور الثاني\nلعام ٢٠٢٥-٢٠٢٦';
  d.meta=Object.assign(defMeta(),{ministry:'',year:'',school:'إدارة إعدادية النهروان',subject:'اللغة العربية',grade:'الخامس الأدبي'});
  d.hide.total=true;
  Object.assign(d.settings,{space:0,fs:13,border:false,bism:false,sep:false,pageNo:false,cont:false,closing:'النجاح هو ثمرة الجهد والتركيز.أنتم لها',cloLines:1});
  d.items=[
    {type:'h',text:'القواعد'},
    Q('',{branches:[
      B('اذكر ماحذف من مبتدأ أو خبر، مع ذكر التقدير؟','','6',['يمين الله لأنصفنَّ المظلوم.','مررتُ بالمحترمِ الصادقُ','لولا العلم لانتشر الجهل.']),
      B('مانوع خبر كان وأخواتها فيما __يأتي__؟(أجب عن اثنين).','','2',['كان ربك قديراً','ليس للخائن ضمير','مازال الصبر عواقبه محمودة'])]}),

/* ---------- حساب الدرجات ---------- */
const ptSum=a=>(a||[]).reduce((s,x)=>s+num(x),0);
const brTotal=b=>num(b.marks)||ptSum(b.ptm);
const qTotal=q=>num(q.marks)||q.branches.reduce((s,b)=>s+brTotal(b),0)||q.parts.reduce((s,p)=>s+(p.t==='points'?ptSum(p.ptm):0),0);
const total=d=>d.items.reduce((s,i)=>(i.type==='q'&&!i.hidden)?s+qTotal(i):s,0);
let SPSC=1;
const spaceFor=(q,d)=>{const v=String(q.space==null?'':q.space).trim();return (v===''?d.settings.space:num(v))*SPSC};

function qLabel(n,d){const st=d.settings.qs;if(st==='ord')return 'السؤال '+(ORD[n-1]||pn(n))+':';if(st==='colon')return 'س'+pn(n)+':';return 'س'+pn(n)+'/'}
function brLabel(i,d){const l=LET[i]||'•';const st=d.settings.bs;return st==='dash'?l+'-':st==='par'?'('+l+')':l+'/'}
function ptLabel(i,d){const n=pn(i+1);const st=d.settings.ps;return st==='par'?'('+n+')':st==='dot'?n+'.':n+'-'}

function setModes(d){NUMM=d.settings.num;DIGM=d.settings.dig}
function titleOf(m){return (m.tt||'').trim()||'مدرس المادة'}
function optWord(n){return n===1?'سؤال واحد':n===2?'سؤالين':(n>=3&&n<=10?pn(n)+' أسئلة':pn(n)+' سؤالاً')}
function headerHTML(d){

${d.settings.student?`<div class="xh-stu"><span>اسم الطالب: <i class="dots wide"></i></span><span>الشعبة: <i class="dots sm"></i></span><span>الدرجة المستحصلة: <i class="dots sm"></i></span></div>`:''}</div>`;
  }

  return `<div class="hh">${d.logo?`<img class="hh-logo" src="${d.logo}" alt="">`:''}<div class="hh-title">${title}</div>${chips.length?`<div class="hh-chips">${chips.map(c=>`<span>${fmt(c)}</span>`).join('')}</div>`:''}</div>`;
}
function noteHTML(d){

}
function closingHTML(d){
  const s=d.settings,m=d.meta,t=String(s.closing||'').trim();
  const tch=(d.kind==='exam'&&!d.hide.teacher&&String(m.teacher||'').trim())?`${esc(titleOf(m))}: ${fmt(m.teacher)}`:'';
  if(!t&&!tch)return '';
  return `<div class="clo" style="margin-top:${num(s.cloLines)*7}mm">${t?`<div class="clo-t">${fmt(t)}</div>`:''}${tch?`<div class="clo-s">${tch}</div>`:''}</div>`;
}
const ansHTML=(label,text)=>text&&text.trim()?`<div class="a-row"><span class="a-no">${label}</span><div class="a-text">${fmt(text)}</div></div>`:'';
const spaceHTML=(mm,d)=>mm>0?`<div class="space${d.settings.lines?' lines':''}" style="height:${mm}mm"></div>`:'';
function marksHTML(v,d){const n=num(v);return d.settings.marks&&n>0?`<span class="q-marks">(${markLabel(n)})</span>`:''}
function stemRow(q,n,d){return `<div class="q-row"><span class="q-no">${qLabel(n,d)}</span><div class="q-text">${fmt(q.text)||'&nbsp;'}</div>${marksHTML(q.marks,d)}</div>`}
const brRow=(b,i,d)=>`<span class="br-no">${brLabel(i,d)}</span><div class="q-text">${fmt(b.text)||'&nbsp;'}</div>${marksHTML(brTotal(b),d)}`;
const ptM=(m,d)=>{const n=num(m);return d.settings.marks&&n>0?`<em class="pt-m">(${markLabel(n)})</em>`:''};
const ptMode=(items,d)=>{const m=d.settings.ptl||'auto';if(m==='row'||m==='col')return m;const a=items.filter(x=>String(x).trim());const avg=a.reduce((n,x)=>n+String(x).replace(/[*_]/g,'').length,0)/(a.length||1);return avg>=18?'row':'col'};
const ptsInline=(items,d,ms)=>`<div class="pts-in ${ptMode(items,d)}">${items.map((t,i)=>`<span><b>${ptLabel(i,d)}</b>${fmt(t)}${ptM((ms||[])[i],d)}</span>`).join('')}</div>`;
const brPts=(b,d)=>{if(!(b.pts&&b.pts.some(x=>String(x).trim())))return '';const ix=b.pts.map((x,i)=>i).filter(i=>String(b.pts[i]).trim());return ptsInline(ix.map(i=>b.pts[i]),d,ix.map(i=>(b.ptm||[])[i]))};
function brTail(q,b,d){const showAns=d.settings.answers&&b.answer&&b.answer.trim();return brPts(b,d)+(showAns?ansHTML('ج',b.answer):spaceHTML(spaceFor(q,d),d))}
function branchHTML(q,b,i,n,d){
  return `<div class="br-wrap"><div class="q-row">${brRow(b,i,d)}</div>${brTail(q,b,d)}</div>`;
}
const isShort=(b,d)=>String(b.text||'').length<=40&&!(b.pts&&b.pts.some(x=>String(x).trim()))&&!(d.settings.answers&&b.answer&&b.answer.trim());
function partHTML(p,d){
  switch(p.t){
    case 'passage':return `<div class="psg">${fmt(p.text)}</div>`;
    case 'poem':{
      const rows=String(p.text||'').split('\n').filter(l=>l.trim()).map(l=>{
        const a=l.split('/');
        return a.length>1?`<div class="vr"><span>${fmt(a[0].trim())}</span><span>${fmt(a.slice(1).join('/').trim())}</span></div>`:`<div class="vr one"><span>${fmt(l.trim())}</span></div>`;
      });
      return `<div class="poem">${rows.join('')}</div>`;
    }
    case 'quote':{
      const o=p.kind==='حديث'?['«','»']:['﴿','﴾'];
      return `<div class="qt">${o[0]} ${fmt(p.text)} ${o[1]}${String(p.src||'').trim()?`<small>(${fmt(p.src)})</small>`:''}</div>`;
    }
    case 'image':return `<div class="img"><img src="${p.src}" style="width:${num(p.w)||60}%;${d.settings.bw?'filter:grayscale(1)':''}" alt=""></div>`;
    case 'lines':return `<div class="space lines" style="height:${(num(p.n)||1)*7.55*SPSC}mm"></div>`;
    case 'choices':return `<div class="chs">${p.opts.map((o,i)=>`<span><b>${brLabel(i,d)}</b>${fmt(o)}</span>`).join('')}</div>`;
    case 'match':return p.pairs.map((r,i)=>`<div class="mt-row"><span class="mt-a"><b>${ptLabel(i,d)}</b> ${fmt(r.a)}</span><span class="mt-g">(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)</span><span class="mt-b"><b>${brLabel(i,d)}</b> ${fmt(r.b)}</span></div>`).join('');
    case 'table':return `<table class="tb"><tr>${p.cols.map(c=>`<th>${fmt(c)||'&nbsp;'}</th>`).join('')}</tr>${p.rows.map(r=>`<tr>${p.cols.map((_,c)=>`<td>${fmt(r[c])||'&nbsp;'}</td>`).join('')}</tr>`).join('')}</table>`;
    case 'points':if(d.settings.compact)return ptsInline(p.items,d,p.ptm);return `<div class="pts">${p.items.map((t,i)=>`<div class="q-row"><span class="br-no">${ptLabel(i,d)}</span><div class="q-text">${fmt(t)||'&nbsp;'}</div>${marksHTML((p.ptm||[])[i],d)}</div>`).join('')}</div>`;
  }
  return '';
}
function buildBlocks(d){
  const s=d.settings;
  let first=(s.bism?`<div class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`:'')+headerHTML(d)+(s.orn?'<div class="orn">﴾ ❖ ﴿</div>':'')+(d.kind==='exam'?noteHTML(d):'');
  const out=[{h:first}];let n=0,pend='';
  const secTot={};let curH=-1;
  d.items.forEach((x,i)=>{if(x.type==='h'){curH=i;secTot[i]=0}else if(!x.hidden&&curH>=0)secTot[curH]+=qTotal(x)});
  d.items.forEach((it,idx)=>{
    if(it.type==='h'){
      const hm=num(it.marks)>0?num(it.marks):((s.secTot&&secTot[idx]>0)?secTot[idx]:0);
      const hms=hm>0?' ('+markLabel(hm)+')':'';
      if(d.kind==='exam'&&!s.color)pend+=`<div class="h-sec">${fmt(it.text)||'&nbsp;'}${hms}</div>`;
      else pend+=`<div class="h-heading">${fmt(it.text)||'&nbsp;'}${hms}</div>`;
      return}
    if(it.hidden)return;
    n++;
    const showAns=s.answers&&it.answer&&it.answer.trim();
    const merged=s.compact&&!String(it.text||'').trim()&&it.branches.length>0;
    const pieces=[{h:merged?`<div class="q-row"><span class="q-no">${qLabel(n,d)}</span>${brRow(it.branches[0],0,d)}</div>${brTail(it,it.branches[0],d)}`:stemRow(it,n,d)}];
    it.parts.forEach((p,i)=>pieces.push({h:partHTML(p,d),glue:i===0}));
    if(showAns)pieces.push({h:ansHTML('ج'+pn(n),it.answer),glue:true});
    const rest=merged?it.branches.slice(1):it.branches,off=merged?1:0;
    if(s.compact&&!merged&&rest.length>=2&&rest.every(b=>isShort(b,d)))
      pieces.push({h:`<div class="br-cols">${rest.map((b,i)=>`<div class="q-row">${brRow(b,i,d)}</div>`).join('')}</div>`,glue:pieces.length===1});
    else if(it.branches.length)rest.forEach((b,i)=>pieces.push({h:branchHTML(it,b,i+off,n,d),glue:pieces.length===1}));
    if(!it.branches.length&&!showAns&&!it.parts.some(p=>p.t==='lines'))pieces.push({h:spaceHTML(spaceFor(it,d),d),glue:true});
    const units=[];
    pieces.forEach(p=>{
      if(p.glue&&units.length&&p.h)units[units.length-1].h+=p.h;
      else if(p.h)units.push({h:p.h});
    });
    units[0].h=pend+units[0].h;pend='';
    if(s.sep&&n>1)units[0].sep=true;
    units.forEach(u=>out.push(u));
  });
  if(pend)out.push({h:pend});
  const c=closingHTML(d);if(c)out.push({h:c});
  return out;
}
function clsOf(d){return (d.kind==='exam'?'exam':'hand')+(d.kind==='exam'&&d.settings.color?' hand':'')+(d.settings.compact?' cmp':'')}
const unitHTML=b=>`<div class="unit${b.sep?' sep':''}">${b.h}</div>`;
function sheetStyle(d){const ex=d.kind==='exam'&&!d.settings.color,s=d.settings;return `--fs:${EFFFS}pt;--qc:${ex?'#000':s.qc};--ac:${ex?'#000':s.ac};--bdc:${ex?'#000':s.qc};--ff:${FONTS[s.font]||FONTS.amiri}`}
function layout(d){
  const cap=$('#probe').getBoundingClientRect().height;
  const m=$('#measure'),body=$('.body',m);
  m.className='sheet '+clsOf(d);m.setAttribute('style',sheetStyle(d));
  body.innerHTML='';
  const blocks=buildBlocks(d);
  const els=blocks.map(b=>{const t=document.createElement('div');t.innerHTML=unitHTML(b);const e=t.firstChild;body.appendChild(e);return e});
  const hs=els.map(e=>e.getBoundingClientRect().height);
  body.innerHTML='';
  const pages=[[]];let used=0;
  blocks.forEach((b,i)=>{
    const last=pages[pages.length-1];
    if(last.length&&used+hs[i]>cap+0.5){pages.push([]);used=0}
    pages[pages.length-1].push(b);used+=hs[i];
  });
  return pages;
}
function paginate(d){
  setModes(d);
  const st=d.settings;
  SPSC=1;EFFFS=st.fs;
  let pages=layout(d);
  if(st.fit1&&pages.length>1){
    const minF=Math.min(st.fs,Math.max(8,num(st.minFs)||10)),minS=Math.min(1,Math.max(.1,(num(st.minSp)||40)/100));
    const f1=Math.max(minF,Math.min(st.fs,11)),tries=[];
    for(let f=st.fs-.5;f>=f1;f-=.5)tries.push([f,1]);
    for(let k=.9;k>=minS-.001;k-=.1)tries.push([f1,Math.max(k,minS)]);
    for(let f=f1-.5;f>=minF;f-=.5)tries.push([f,minS]);
    for(const t of tries){EFFFS=t[0];SPSC=t[1];pages=layout(d);if(pages.length===1)break}
  }
  return pages;
}
function sheetsOf(d,pages){
  const st=sheetStyle(d),s=d.settings,cls=clsOf(d)+(s.border?' bd'+(s.frame==='double'?' bd2':s.frame==='thick'?' bd3':''):'');
  return pages.map((p,i)=>{
    const last=i===pages.length-1;
    const foot=(s.pageNo||s.cont)?`<div class="foot"><span>${esc(d.title||'')}</span><span>${s.pageNo?'صفحة '+pn(i+1)+' من '+pn(pages.length):''}</span><span>${(s.cont&&!last)?'يتبع':''}</span></div>`:'';
    return `<section class="sheet ${cls}" style="${st}"><div class="body">${p.map(unitHTML).join('')}</div>${foot}</section>`;
  });
}

let hist=[],hi=-1,hT;
const snap=()=>JSON.stringify(cur);
function histReset(){hist=[snap()];hi=0;updUndo()}
function pushHist(){if(!cur)return;const s=snap();if(s===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1;updUndo()}
function pushHistSoon(){clearTimeout(hT);hT=setTimeout(pushHist,600)}
function updUndo(){const u=$('#btnUndo'),r=$('#btnRedo');if(u)u.disabled=hi<=0;if(r)r.disabled=hi>=hist.length-1}
function histGo(dir){
  clearTimeout(hT);pushHist();
  const k=hi+dir;if(k<0||k>=hist.length)return;
  hi=k;const o=JSON.parse(hist[hi]);
  Object.keys(cur).forEach(x=>delete cur[x]);Object.assign(cur,o);
  saveNow();updUndo();rerender(true);
}

function partEditor(p,i,k,n){
  const base=`items.${i}.parts.${k}`;
  const head=(t)=>`<div class="part-h"><b>${t}</b>${ptools(i,k,n)}</div>`;
  switch(p.t){
    case 'passage':return `<div class="part">${head('نص / قطعة')}<textarea class="in" data-bind="${base}.text" placeholder="اكتب القطعة هنا">${esc(p.text)}</textarea></div>`;
    case 'poem':return `<div class="part">${head('أبيات شعر')}<textarea class="in" data-bind="${base}.text" placeholder="صدر البيت / عجز البيت">${esc(p.text)}</textarea><div class="hint" style="margin:0">اكتب كل بيت في سطر، وافصل بين الشطرين بعلامة /</div></div>`;
    case 'quote':return `<div class="part">${head('آية / حديث')}<div class="chips">${['آية','حديث'].map(x=>`<button class="chip" data-act="set" data-path="${base}.kind" data-val="${x}" aria-pressed="${p.kind===x}">${x}</button>`).join('')}</div><textarea class="in" data-bind="${base}.text" placeholder="نص ${p.kind==='حديث'?'الحديث':'الآية'}">${esc(p.text)}</textarea><input class="in" data-bind="${base}.src" value="${esc(p.src)}" placeholder="المصدر (اختياري) مثل: سورة البقرة، آية ٢"></div>`;
    case 'lines':return `<div class="part">${head('أسطر إجابة')}<div class="row"><label>عدد الأسطر</label>${stepper(base+'.n',p.n,1,20)}</div></div>`;
    case 'choices':return `<div class="part">${head('خيارات')}${p.opts.map((o,j)=>`<div class="br-head"><span class="br-tag">${LET[j]}</span><input class="in grow" data-bind="${base}.opts.${j}" value="${esc(o)}" placeholder="الخيار"><button class="ico" data-act="parr" data-op="del" data-sub="opts" data-i="${i}" data-k="${k}" data-j="${j}" aria-label="حذف">✕</button></div>`).join('')}${p.opts.length<6?`<div><button class="btn sm" data-act="parr" data-op="add" data-sub="opts" data-i="${i}" data-k="${k}">+ خيار</button></div>`:''}</div>`;
    case 'match':return `<div class="part">${head('مطابقة')}${p.pairs.map((r,j)=>`<div class="br-head"><span class="br-tag">${ar(j+1)}</span><input class="in grow" data-bind="${base}.pairs.${j}.a" value="${esc(r.a)}" placeholder="العمود الأول"><span class="br-tag">${LET[j]}</span><input class="in grow" data-bind="${base}.pairs.${j}.b" value="${esc(r.b)}" placeholder="العمود الثاني"><button class="ico" data-act="parr" data-op="del" data-sub="pairs" data-i="${i}" data-k="${k}" data-j="${j}" aria-label="حذف">✕</button></div>`).join('')}<div><button class="btn sm" data-act="parr" data-op="add" data-sub="pairs" data-i="${i}" data-k="${k}">+ صف</button></div></div>`;
    case 'table':return `<div class="part">${head('جدول / مقارنة')}<div class="tbed"><table><tr>${p.cols.map((c,j)=>`<td><input class="in" data-bind="${base}.cols.${j}" value="${esc(c)}" placeholder="العنوان ${ar(j+1)}"></td>`).join('')}</tr>${p.rows.map((r,x)=>`<tr>${p.cols.map((_,j)=>`<td><input class="in" data-bind="${base}.rows.${x}.${j}" value="${esc(r[j])}"></td>`).join('')}</tr>`).join('')}</table></div><div class="row"><button class="btn sm" data-act="parr" data-op="add" data-sub="rows" data-i="${i}" data-k="${k}">+ صف</button><button class="btn sm" data-act="parr" data-op="del" data-sub="rows" data-i="${i}" data-k="${k}" ${p.rows.length<2?'disabled':''}>− صف</button><button class="btn sm" data-act="parr" data-op="add" data-sub="cols" data-i="${i}" data-k="${k}" ${p.cols.length>=4?'disabled':''}>+ عمود</button><button class="btn sm" data-act="parr" data-op="del" data-sub="cols" data-i="${i}" data-k="${k}" ${p.cols.length<2?'disabled':''}>− عمود</button></div></div>`;
    case 'image':return `<div class="part">${head('صورة')}<img src="${p.src}" alt="" style="max-width:100%;max-height:140px;border-radius:8px;align-self:flex-start"><div class="row"><label>العرض</label>${stepper(base+'.w',num(p.w)||60,20,100,'٪',10)}</div></div>`;
    case 'points':return `<div class="part">${head('نقاط')}${p.items.map((t,j)=>`<div class="br-head"><span class="br-tag">${ar(j+1)}</span><input class="in grow" data-bind="${base}.items.${j}" value="${esc(t)}" placeholder="النقطة"><input class="in mk" inputmode="decimal" data-bind="${base}.ptm.${j}" value="${esc((p.ptm||[])[j]||'')}" placeholder="درجة" aria-label="درجة النقطة"><button class="ico" data-act="parr" data-op="del" data-sub="items" data-i="${i}" data-k="${k}" data-j="${j}" aria-label="حذف">✕</button></div>`).join('')}<div><button class="btn sm" data-act="parr" data-op="add" data-sub="items" data-i="${i}" data-k="${k}">+ نقطة</button></div></div>`;
  }
  return '';
}
const QCHIPS=[['branch','+ فرع'],['points','+ نقطة'],['passage','نص / قطعة'],['poem','أبيات شعر'],['quote','آية / حديث'],['lines','أسطر إجابة'],['choices','خيارات'],['match','مطابقة'],['table','جدول'],['image','صورة']];
const qtools=(i,d,q)=>`<button class="ico ${q.hidden?'off':''}" data-act="q-eye" data-i="${i}" aria-label="${q.hidden?'إظهار':'إخفاء'} السؤال">${q.hidden?EYEOFF:EYE}</button><button class="ico" data-act="q-dup" data-i="${i}" aria-label="نسخ السؤال">⧉</button>`+tools(i,d);

<button class="ico" data-act="del-br" data-i="${i}" data-j="${j}" aria-label="حذف الفرع">✕</button></div>

  return `<div class="card${q.hidden?' dim':''}" data-i="${i}">
<div class="card-top"><span class="tag">${q.hidden?'مخفي':'س'+ar(n)}</span><div class="tools" style="flex-wrap:wrap;justify-content:flex-end">${qtools(i,d,q)}</div></div>

<label for="m${i}" style="margin-inline-start:auto">الدرجة</label><input id="m${i}" class="in mk" inputmode="decimal" data-bind="items.${i}.marks" value="${esc(q.marks)}" placeholder="+ درجة">
${ex?`<label for="s${i}">مسافة (مم)</label><input id="s${i}" class="in mk" inputmode="numeric" data-bind="items.${i}.space" value="${esc(q.space)}" placeholder="${d.settings.space}">`:''}</div>
<div class="qchips">${QCHIPS.map(c=>`<button class="chip" data-act="addpart" data-t="${c[0]}" data-i="${i}">${c[1]}</button>`).join('')}</div>

<details class="ans" ${q.answer?'open':''}><summary>${q.branches.length?'إجابة السؤال (اختياري)':'الإجابة'}</summary><textarea class="in" data-bind="items.${i}.answer" placeholder="اكتب الإجابة">${esc(q.answer)}</textarea></details>

function itemsTab(d){
  let n=0;

function readImage(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>toast('تعذّر قراءة الصورة');im.src=r.result};
  r.onerror=()=>toast('تعذّر قراءة الملف');r.readAsDataURL(file);
}
function voice(i,b){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('الكتابة بالصوت غير مدعومة هنا، استخدم ميكروفون الكيبورد');return}
  if(rec){try{rec.stop()}catch(e){}return}
  rec=new SR();rec.lang='ar-IQ';rec.interimResults=false;rec.continuous=false;
  b.classList.add('rec');b.textContent='جارٍ الاستماع… اضغط للإيقاف';
  rec.onresult=e=>{const t=Array.from(e.results).map(r=>r[0].transcript).join(' ');const q=cur.items[i];if(q)q.text=(q.text?q.text+' ':'')+t};
  rec.onerror=()=>toast('تعذّر التعرّف على الصوت');
  rec.onend=()=>{rec=null;commit();if(view==='editor')rerender(true)};
  try{rec.start()}catch(e){rec=null;b.classList.remove('rec');toast('تعذّر تشغيل الميكروفون')}
}
function dictate(b){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('الكتابة بالصوت غير مدعومة في هذا المتصفح، استخدم ميكروفون الكيبورد');return}
  if(rec){try{rec.stop()}catch(e){}return}
  const f=lastField;if(!f||!f.isConnected)return;
  rec=new SR();rec.lang='ar-IQ';rec.interimResults=false;rec.continuous=true;
  b.classList.add('rec');b.lastChild.textContent='جارٍ الاستماع';
  rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';if(t)insertAt(t)};
  rec.onerror=()=>toast('تعذّر التعرّف على الصوت');
  rec.onend=()=>{rec=null;b.classList.remove('rec');b.lastChild.textContent='صوت'};
  try{rec.start()}catch(e){rec=null;b.classList.remove('rec');toast('تعذّر تشغيل الميكروفون')}
}
function closeSheet(){$('#msheet').hidden=true}
function newPart(t){
  switch(t){
    case 'passage':return{t,text:''};case 'poem':return{t,text:''};
    case 'quote':return{t,kind:'آية',text:'',src:''};case 'lines':return{t,n:3};
    case 'choices':return{t,opts:['','','','']};
    case 'table':return{t,cols:['',''],rows:[['',''],['','']]};
    case 'match':return{t,pairs:[{a:'',b:''},{a:'',b:''},{a:'',b:''}]};
    case 'points':return{t,items:['','']};
  }
}

function fmtHome(){const f=document.getElementById('fmt');if(f&&f.parentNode!==document.body)document.body.appendChild(f)}
function placeFmt(){const vv=window.visualViewport,f=$('#fmt');if(f.hidden)return;
  f.classList.toggle('inl',FMTPOS==='inline');
  if(FMTPOS==='inline'){const lf=lastField;if(lf&&lf.isConnected){const host=lf.closest('.br-head')||lf;if(host.nextElementSibling!==f)host.after(f)}f.style.top='auto';f.style.bottom='auto';return}
  fmtHome();if(!f.classList.contains('ontop')===(FMTPOS==='top'))f.classList.toggle('ontop',FMTPOS==='top');
  if(FMTPOS==='top'){f.style.bottom='auto';f.style.top=(vv?vv.offsetTop:0)+'px';return}
  if(vv){const up=FMTPOS==='lift'?170:FMTPOS==='lift2'?220:0;f.style.bottom='auto';f.style.top=Math.max(0,vv.offsetTop+vv.height-f.offsetHeight-up)+'px'}else{f.style.top='auto';f.style.bottom='0'}}
let fmtRaf=0;
let kbSeen=false;
function fmtLoop(){const f=$('#fmt');if(f.hidden){fmtRaf=0;kbSeen=false;return}
  const vv=window.visualViewport;
  if(vv){const open=window.innerHeight-vv.height>120;if(open)kbSeen=true;else if(kbSeen){kbSeen=false;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();hideFmt(true);fmtRaf=0;return}}
  placeFmt();fmtRaf=requestAnimationFrame(fmtLoop)}
function showFmt(){const f=$('#fmt');f.hidden=false;document.body.classList.add('fmt-on');placeFmt();if(!fmtRaf)fmtRaf=requestAnimationFrame(fmtLoop)}
function hideFmt(force){const f=$('#fmt');if(!force&&(isTextField(document.activeElement)||Date.now()-fmtTouch<900))return;f.hidden=true;$('#fmtPal').hidden=true;document.body.classList.remove('fmt-on')}
function insertAt(txt,wrap){
  const f=lastField;if(!f||!f.isConnected)return;
  f.focus();const s=f.selectionStart,e=f.selectionEnd;
  if(wrap){const sel=f.value.slice(s,e);f.setRangeText(wrap+sel+wrap,s,e,'end');if(!sel){const p=s+wrap.length;f.setSelectionRange(p,p)}}
  else f.setRangeText(txt,s,e,'end');
  f.dispatchEvent(new Event('input',{bubbles:true}));
}
function insertPair(o,c){
  const f=lastField;if(!f||!f.isConnected)return;
  f.focus();const s0=f.selectionStart,e0=f.selectionEnd,sel=f.value.slice(s0,e0);
  f.setRangeText(o+' '+sel+' '+c,s0,e0,'end');
  if(!sel){const q=s0+o.length+1;f.setSelectionRange(q,q)}
  f.dispatchEvent(new Event('input',{bubbles:true}));
}

function renderPreview(){
  if(view!=='preview'||!cur)return;
  const pages=paginate(cur);
  sheetsArr=sheetsOf(cur,pages);
  $('#printRoot').innerHTML=sheetsArr.join('');
  pageIdx=Math.min(pageIdx,sheetsArr.length-1);
  $('#pvSub').textContent=(sheetsArr.length>1?ar(sheetsArr.length)+' صفحات A4':'صفحة A4')+' – كما ستُطبع تماماً';
  showPage();
}
function showPage(){
  const stage=$('#stage');
  stage.innerHTML=sheetsArr[pageIdx]||'';
  $('#thumbs').innerHTML=sheetsArr.map((_,i)=>`<button data-act="goto" data-i="${i}" ${i===pageIdx?'aria-current="true"':''} aria-label="صفحة ${ar(i+1)}">${ar(i+1)}</button>`).join('');
  fit();
  const cb=$('#thumbs [aria-current]');if(cb&&cb.scrollIntoView)cb.scrollIntoView({block:'nearest',inline:'center'});
}
function fit(){
  const v=$('#viewer'),stage=$('#stage'),sh=$('.sheet',stage);if(!sh)return;
  const base=Math.min((v.clientWidth-24)/PW,1.15),s=base*ZOOMS[zoom];
  stage.style.width=(PW*s)+'px';stage.style.height=(PH*s)+'px';
  sh.style.transform=`scale(${s})`;
  $('#zoomOut').textContent=ar(Math.round(ZOOMS[zoom]*100))+'٪';
}
function setPage(i){pageIdx=Math.max(0,Math.min(sheetsArr.length-1,i));showPage();$('#viewer').scrollTop=0}
const H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[data-lib="'+src+'"]')&&(window.html2canvas&&window.jspdf))return res();const t=document.createElement('script');t.src=src;t.dataset.lib=src;t.onload=res;t.onerror=()=>rej(new Error('load'));document.head.appendChild(t)})}
async function buildPDF(){
  if(!(window.html2canvas&&window.jspdf)){await loadScript(H2C);await loadScript(JSPDF)}
  await fontsReady();renderPreview();
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-12000px;top:0;';holder.innerHTML=sheetsArr.join('');document.body.appendChild(holder);
  try{
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const els=$$('.sheet',holder);
    for(let i=0;i<els.length;i++){
      els[i].style.transform='none';els[i].style.position='relative';
      const c=await window.html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(i)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);
    }
    return pdf.output('blob');
  }finally{holder.remove()}
}
async function savePDF(share){
  const name=((cur.title||'ورقة').split('\n')[0].trim()||'ورقة')+'.pdf';
  toast('جارٍ تجهيز الملف…');
  try{
    const blob=await buildPDF();const file=new File([blob],name,{type:'application/pdf'});
    if(share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
    const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast(share?'تم حفظ الملف، شاركه من الملفات':'تم تجهيز ملف PDF');
  }catch(e){
    if(e&&e.name==='AbortError')return;
    toast('تعذّر إنشاء PDF هنا، افتح الطباعة واختر حفظ كـ PDF');doPrint();
  }
}
function doPrint(){
  fontsReady().then(()=>{renderPreview();setTimeout(()=>{try{window.print()}catch(e){toast('تعذّرت الطباعة من هذا المتصفح')}},60)});
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,k=+b.dataset.k,id=b.dataset.id;

    case 'q-eye':{cur.items[i].hidden=!cur.items[i].hidden;afterChange(true);break}
    case 'q-dup':{const c=JSON.parse(JSON.stringify(cur.items[i]));cur.items.splice(i+1,0,c);afterChange(true);toast('تم نسخ السؤال');break}

    case 'menu-kind':{cur.kind=cur.kind==='exam'?'handout':'exam';if(cur.kind==='handout'&&cur.settings.qc==='#000000'){cur.settings.qc=PALS[0][0];cur.settings.ac=PALS[0][1]}cur.settings.color=false;closeSheet();afterChange(true);break}

    case 'dup':{const s=docs.find(d=>d.id===id);if(!s)break;const c=JSON.parse(JSON.stringify(s));c.id=uid();c.title=(s.title||'')+' (نسخة)';c.updated=Date.now();docs.unshift(c);saveNow();renderHome();toast('تم النسخ');break}
    case 'del':{if(!confirmTap(b))break;docs=docs.filter(d=>d.id!==id);saveNow();renderHome();break}

    case 'tab':tab=b.dataset.tab;rerender();break;
    case 'preview':pageIdx=0;go('preview');break;
    case 'add-q':{cur.items.push(Q(''));commit();rerender();const c=$$('#edBody .card').pop();if(c){c.scrollIntoView({block:'center'});const t=$('textarea',c);if(t)t.focus()}break}
    case 'add-h':{cur.items.push({type:'h',text:''});commit();rerender();const c=$$('#edBody .card').pop();if(c){c.scrollIntoView({block:'center'});const t=$('input',c);if(t)t.focus()}break}
    case 'add-br':{cur.items[i].branches.push({text:'',marks:'',answer:''});commit();rerender(true);const c=$('#edBody .card[data-i="'+i+'"]');const ins=c&&$$('.branch input.grow',c).pop();if(ins)ins.focus();break}

    case 'up':case 'down':{const t=a==='up'?i-1:i+1;if(t<0||t>=cur.items.length)break;const it=cur.items;[it[i],it[t]]=[it[t],it[i]];commit();rerender();const c=$('#edBody .card[data-i="'+t+'"]');if(c)c.scrollIntoView({block:'center'});break}

});

(function(){
  let x0=0,y0=0;const v=$('#viewer');
  v.addEventListener('touchstart',e=>{const t=e.changedTouches[0];x0=t.clientX;y0=t.clientY},{passive:true});
  v.addEventListener('touchend',e=>{
    if(zoom!==0)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dy)<45)setPage(pageIdx+(dx<0?1:-1));
  },{passive:true});
})();
document.addEventListener('keydown',e=>{
  if(view!=='preview')return;
  if(e.key==='ArrowLeft')setPage(pageIdx+1);else if(e.key==='ArrowRight')setPage(pageIdx-1);
});
window.addEventListener('resize',()=>{if(view==='preview')fit()});
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',saveNow);
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>{if(view==='preview')renderPreview()});

load();route();
})();
</script>
</body>
</html>
